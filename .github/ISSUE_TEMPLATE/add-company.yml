name: "בקשה להוסיף חברה"
description: "חברה שהסוכן עוד לא בודק. אנחנו בודקים אם אפשר, ומוסיפים אותה לכולם בעדכון."
title: "להוסיף חברה: "
labels: ["add-company"]
body:
  - type: input
    id: company
    attributes:
      label: "שם החברה"
    validations:
      required: true
  - type: input
    id: careers
    attributes:
      label: "קישור לדף הדרושים שלה (אם יש)"
  - type: dropdown
    id: sector
    attributes:
      label: "תחום"
      options: ["בנקים", "ביטוח ובתי השקעות", "כרטיסי אשראי ופינטק", "הייטק", "ביטחון", "תעשייה וייצור", "פארמה ומכשור רפואי", "בריאות", "קמעונאות ומזון", "תקשורת", "אנרגיה ותשתיות", "תחבורה ולוגיסטיקה", "נדל\"ן ובנייה", "מגזר ציבורי", "חינוך ועמותות", "אחר"]
