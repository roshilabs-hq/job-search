name: "נתקעתי"
description: "ספרו לנו איפה נתקעתם. כל היתקעות היא באג בהדרכה, ואנחנו מתקנים אותה."
title: "נתקעתי: "
labels: ["stuck"]
body:
  - type: markdown
    attributes:
      value: "⚠️ **הטופס הזה ציבורי. לא מדביקים כאן סיסמה, קורות חיים, או צילום מסך שרואים בו פרטים אישיים.**"
  - type: dropdown
    id: step
    attributes:
      label: "באיזה שלב נתקעתם?"
      options:
        - "מורידים את הסוכן"
        - "ריאיון היכרות וקורות חיים"
        - "איפה, כמה, ואילו תחומים"
        - "מגדירים מייל"
        - "ריצה ראשונה ותזמון"
        - "שימוש יומיומי"
        - "הסקיל באפליקציית Claude"
        - "לפני שהתחלתי / לא בטוח/ה"
  - type: textarea
    id: what
    attributes:
      label: "מה ראיתם על המסך, ומה ניסיתם?"
      description: "אפשר להדביק צילום מסך (Ctrl+V). בלי פרטים אישיים."
    validations:
      required: true
